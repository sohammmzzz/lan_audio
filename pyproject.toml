[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lanaudio"
version = "1.2.0"
description = "Stream your PC's audio, lossless and in sync, to everyone on your LAN. A sassy, animated terminal app."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanket Jambhulkar" }]
keywords = [
    "audio", "streaming", "lan", "multiroom", "wasapi", "loopback",
    "lossless", "sync", "cli", "terminal", "rich", "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: System :: Networking",
]
dependencies = [
    "numpy",
    "rich>=13",
    "PyAudioWPatch; sys_platform == 'win32'",
]

[project.optional-dependencies]
opus = ["opuslib"]

[project.urls]
Homepage = "https://github.com/YOUR-GITHUB-USER/lan-audio"
Documentation = "https://github.com/YOUR-GITHUB-USER/lan-audio#readme"
Issues = "https://github.com/YOUR-GITHUB-USER/lan-audio/issues"
Changelog = "https://github.com/YOUR-GITHUB-USER/lan-audio/releases"

[project.scripts]
lanaudio = "lanaudio:main"

[tool.setuptools]
py-modules = ["lanaudio"]
include-package-data = false
